name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  tests:
    name: tests / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: exit 1
  required:
    name: ci / required
    if: always()
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: edbfi/automation/actions/gate@v3.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: validate tests
