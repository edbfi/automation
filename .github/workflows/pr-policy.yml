name: Pull request policy
on:
  workflow_call:
    inputs:
      minimum-approvals:
        type: number
        default: 0
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    name: ci / policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/pr-policy@v3.0.1
        with:
          token: ${{ github.token }}
          minimum-approvals: ${{ inputs.minimum-approvals }}
