name: Bun validation
on:
  workflow_call:
    inputs:
      command:
        description: Explicit repository-owned validation command; must not be empty.
        type: string
        required: true
      version:
        description: Pinned runtime version from the caller toolchain configuration.
        type: string
        required: true
      working-directory:
        description: Directory in which the validation command runs.
        type: string
        default: .
      install-directory:
        description: Bun lockfile root; defaults to working-directory. Set to the workspace root for a workspace member.
        type: string
        default: ''
      node-version:
        description: Node version for tools whose executables use a Node shebang.
        type: string
        # renovate: datasource=node-version depName=node
        default: 24.21.0
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 30
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs
        env:
          CHECK_COMMAND: ${{ inputs.command }}
          RUNTIME_VERSION: ${{ inputs.version }}
        run: test -n "$CHECK_COMMAND" && test -n "$RUNTIME_VERSION"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ inputs.version }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate lockfile root
        working-directory: ${{ inputs.install-directory || inputs.working-directory }}
        run: |
          test -f package.json
          locks=0
          for lock in bun.lock bun.lockb; do
            if test -f "$lock"; then
              locks=$((locks + 1))
            fi
          done
          if test "$locks" -ne 1; then
            echo 'Expected exactly one bun.lock or bun.lockb in install-directory.' >&2
            exit 1
          fi
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles(format('{0}/bun.lock', inputs.install-directory || inputs.working-directory), format('{0}/bun.lockb', inputs.install-directory || inputs.working-directory)) }}
      - run: bun install --frozen-lockfile
        working-directory: ${{ inputs.install-directory || inputs.working-directory }}
      - name: Run required check
        env:
          CHECK_COMMAND: ${{ inputs.command }}
        run: bash --noprofile --norc -e -o pipefail -c "$CHECK_COMMAND"
      - name: Reject tracked-file mutation
        run: git diff --exit-code HEAD
